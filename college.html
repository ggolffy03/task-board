<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>COLLEGE // ASSIGNMENT LOG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF2E8;
    --card: #FFFFFF;
    --primary: #EE4E1D;
    --secondary: #CF9068;
    --text: #231F20;
    --muted: #555555;
    --ink: #231F20;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Kanit", "Noto Sans Thai", sans-serif;
    padding: 16px;
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 960px; margin: 0 auto; }

  /* Touch targets: Apple HIG recommends ≥44px */
  button { touch-action: manipulation; }

  /* 3D pixel helper */
  .px {
    background: var(--card);
    border: 3px solid var(--ink);
    box-shadow: 6px 6px 0 rgba(35,31,32,.85);
  }
  .mono { font-family: "Press Start 2P", "Silkscreen", monospace; }
  .thin { font-family: "Silkscreen", monospace; }

  /* ---------- Header HUD ---------- */
  .hud {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 16px 20px; margin-bottom: 26px;
  }
  .hud .logo {
    font-family: "Press Start 2P", monospace; font-size: 14px;
    background: var(--primary); color: #fff;
    border: 3px solid var(--ink); padding: 12px 16px;
    box-shadow: 5px 5px 0 rgba(35,31,32,.85); white-space: nowrap;
  }
  .hud .sub { font-size: 14px; font-weight: 600; color: var(--muted); }
  .hud .sub b { color: var(--text); }
  .hud .today { margin-left: auto; text-align: right; }
  .hud .today .lbl { font-family: "Silkscreen"; font-size: 9px; color: var(--muted); letter-spacing: 1px; }
  .hud .today .d { font-family: "Press Start 2P"; font-size: 12px; color: var(--primary); margin-top: 4px; }

  /* Faculty card (button) */
  #facultyCard { cursor: pointer; }
  #facultyCard:active { transform: translate(2px,2px); box-shadow: 4px 4px 0 rgba(35,31,32,.85); }
  #facultyCard .hint {
    display: block; font-family: "Silkscreen"; font-size: 8px; color: var(--muted);
    letter-spacing: 1px; margin-top: 8px;
  }

  /* ---------- Summary bar ---------- */
  .stats { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; }
  .stat {
    flex: 1; min-width: 130px; padding: 14px 16px;
    border: 3px solid var(--ink); box-shadow: 4px 4px 0 rgba(35,31,32,.8); background: var(--card);
  }
  .stat .n { font-family: "Press Start 2P"; font-size: 20px; }
  .stat .n.orange { color: var(--primary); }
  .stat .lbl { font-size: 11px; color: var(--muted); margin-top: 4px; font-weight: 600; }

  /* ---------- Calendar ---------- */
  .cal { padding: 18px 20px; margin-bottom: 26px; }
  .cal-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .cal-head .title { font-family: "Silkscreen"; font-size: 15px; letter-spacing: 1px; flex: 1; }
  .cal-head .nav {
    width: 38px; height: 38px; background: var(--card);
    border: 3px solid var(--ink); box-shadow: 3px 3px 0 rgba(35,31,32,.8);
    font-size: 18px; font-weight: 700; cursor: pointer; font-family: inherit; line-height: 1;
    color: var(--text);
  }
  .cal-head .nav:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 rgba(35,31,32,.8); }
  .cal-head .nav.today-btn { width: auto; padding: 0 14px; font-family: "Silkscreen"; font-size: 11px; background: var(--primary); color: #fff; }

  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .cal-dow { text-align: center; font-family: "Silkscreen"; font-size: 9px; color: var(--muted); letter-spacing: 1px; padding: 4px 0; }
  .cal-cell {
    position: relative; min-height: 76px; padding: 6px; text-align: left;
    background: var(--card); border: 2px solid var(--ink); cursor: pointer;
    box-shadow: 3px 3px 0 rgba(35,31,32,.6); font-family: inherit;
    transition: transform .05s;
    -webkit-tap-highlight-color: transparent;
  }
  .cal-cell:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 rgba(35,31,32,.6); }
  .cal-cell .day { font-family: "Silkscreen"; font-size: 12px; }
  .cal-cell.empty { background: #f7e6d8; border-style: dashed; cursor: default; box-shadow: none; }
  .cal-cell.other { opacity: .35; }
  .cal-cell.today { border-color: var(--primary); border-width: 3px; box-shadow: 3px 3px 0 rgba(238,78,29,.7); }
  .cal-cell.today .day { color: var(--primary); }
  .cal-cell .dots { display: flex; flex-direction: column; gap: 3px; margin-top: 4px; }
  .cal-cell .dot {
    display: block; font-size: 9px; line-height: 1.25; padding: 1px 5px;
    background: var(--secondary); color: #fff; border: 1px solid var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cal-cell .dot.overdue { background: var(--primary); }
  .cal-cell .more { font-size: 9px; color: var(--muted); margin-top: 2px; font-weight: 700; }

  /* Mobile-first (iPhone / iPad): compact but touch-friendly */
  @media (max-width: 640px) {
    body { padding: 12px; }
    .cal { padding: 12px 12px; }
    .cal-grid { gap: 5px; }
    .cal-cell { min-height: 56px; padding: 5px; border-width: 2px; }
    .cal-cell .day { font-size: 11px; }
    .cal-cell .dot { font-size: 8px; padding: 1px 3px; border: none; }
    .cal-cell .more { font-size: 8px; }
    .cal-head .nav { width: 44px; height: 44px; }
    .hud { gap: 10px; padding: 14px 14px; }
    .hud .logo { font-size: 11px; padding: 10px 12px; }
    .stat { padding: 12px 12px; }
    .stat .n { font-size: 17px; }
    .card { padding: 14px 14px; }
    .card .score { position: static; margin-top: 10px; }
    .mx-quad { min-height: 60px; }
  }

  /* ---------- Assignment cards (list below calendar) ---------- */
  .list { display: flex; flex-direction: column; gap: 18px; }
  .section-title { font-family: "Silkscreen"; font-size: 12px; letter-spacing: 1px; margin: 0 0 14px; }
  .card { position: relative; padding: 18px 20px; }
  .card .code {
    display: inline-block; font-family: "Silkscreen"; font-size: 11px;
    background: var(--secondary); color: #fff; padding: 4px 10px;
    border: 2px solid var(--ink); box-shadow: 3px 3px 0 rgba(35,31,32,.7);
    margin-bottom: 10px; letter-spacing: 1px;
  }
  .card h2 { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .card .inst { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .card .inst b { color: var(--text); }
  .card .task { background: #fff8f3; border: 2px dashed var(--secondary); padding: 10px 12px; font-size: 13px; line-height: 1.55; margin-bottom: 14px; }
  .card .meta { display: flex; gap: 18px; flex-wrap: wrap; }
  .card .meta .m { min-width: 120px; }
  .card .meta .m .lbl { font-family: "Silkscreen"; font-size: 8px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .card .meta .m .val { font-size: 13px; font-weight: 600; margin-top: 2px; }
  .card .score { position: absolute; top: 16px; right: 18px; font-family: "Press Start 2P"; font-size: 15px; color: var(--primary); }
  .card.due-soon { border-color: var(--primary); }
  .card.overdue { border-color: var(--primary); background: #FFF5F0; }
  .card.overdue .badge {
    display: inline-block; font-family: "Silkscreen"; font-size: 9px;
    background: var(--primary); color: #fff; padding: 3px 8px; margin-left: 8px;
    border: 2px solid var(--ink);
  }

  .empty { padding: 40px 20px; text-align: center; color: var(--muted); }
  .empty .big { font-family: "Press Start 2P"; font-size: 16px; margin-bottom: 8px; color: var(--text); }

  /* ---------- Day detail modal ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(35,31,32,.55); z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.hidden { display: none; }
  .modal { width: 100%; max-width: 560px; max-height: 80vh; overflow-y: auto; padding: 20px; }
  .modal .mhead { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .modal .mhead h2 { font-family: "Silkscreen"; font-size: 14px; letter-spacing: 1px; flex: 1; }
  .modal .close {
    width: 32px; height: 32px; border: 2px solid var(--ink); background: var(--primary); color: #fff;
    font-weight: 700; cursor: pointer; font-family: inherit; box-shadow: 2px 2px 0 rgba(35,31,32,.7);
  }
  .modal .mini { padding: 12px 14px; margin-bottom: 10px; background: #fff8f3; border: 2px solid var(--ink); }
  .modal .mini .t { font-weight: 700; font-size: 14px; }
  .modal .mini .s { font-size: 12px; color: var(--muted); margin-top: 2px; }

  footer { margin-top: 28px; text-align: center; font-family: "Silkscreen"; font-size: 10px; color: var(--muted); }

  /* ---------- Priority Matrix ---------- */
  .matrix { padding: 18px 20px; margin-bottom: 26px; }
  .matrix .mtitle { font-family: "Silkscreen"; font-size: 14px; letter-spacing: 1px; margin-bottom: 16px; }
  .mx-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .mx-grid { grid-template-columns: 1fr; } }
  .mx-quad { border: 3px solid var(--ink); padding: 12px 14px; min-height: 96px; box-shadow: 4px 4px 0 rgba(35,31,32,.6); }
  .mx-quad .qh { font-family: "Silkscreen"; font-size: 10px; letter-spacing: 1px; padding: 4px 9px; display: inline-block; border: 2px solid var(--ink); color: #fff; margin-bottom: 10px; }
  .mx-quad .qsub { font-size: 10px; color: var(--muted); margin-left: 6px; font-weight: 600; }
  .mx-q1 { background: #ffe3dc; } .mx-q1 .qh { background: #EE4E1D; }
  .mx-q2 { background: #fff6e0; } .mx-q2 .qh { background: #E0A800; }
  .mx-q3 { background: #ffe9d6; } .mx-q3 .qh { background: #CF9068; }
  .mx-q4 { background: #f2f2f2; } .mx-q4 .qh { background: #8a8a8a; }
  .mx-item { font-size: 12px; padding: 6px 9px; margin-bottom: 6px; background: var(--card); border: 2px solid var(--ink); font-weight: 600; word-break: break-word; }
  .mx-item .c { color: var(--muted); font-weight: 400; font-size: 11px; }
  .mx-empty { font-size: 11px; color: var(--muted); }
  .mx-unassigned { margin-top: 14px; border: 2px dashed var(--ink); padding: 12px 14px; }
  .mx-unassigned .lbl { font-family: "Silkscreen"; font-size: 9px; color: var(--muted); letter-spacing: 1px; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <button class="hud px" id="facultyCard" style="width:100%;text-align:left;font-family:inherit;">
    <div class="logo">🎓 CLASS LOG</div>
    <div class="sub">คณะ <b id="faculty">—</b></div>
    <div class="today">
      <div class="lbl">TODAY</div>
      <div class="d" id="today">—</div>
    </div>
    <span class="hint">TAP TO VIEW ADD LOG</span>
  </button>

  <!-- Priority Matrix -->
  <div class="matrix px" style="margin-top:26px">
    <div class="mtitle">▦ PRIORITY MATRIX // ความสำคัญของงาน</div>
    <div class="mx-grid" id="mxGrid"></div>
    <div class="mx-unassigned" id="mxUnassigned" style="display:none"></div>
  </div>

  <div class="stats">
    <div class="stat"><div class="n" id="stTotal">0</div><div class="lbl">งานทั้งหมด</div></div>
    <div class="stat"><div class="n orange" id="stPending">0</div><div class="lbl">รอส่ง / ค้าง</div></div>
    <div class="stat"><div class="n" id="stDone">0</div><div class="lbl">ส่งแล้ว</div></div>
  </div>

  <!-- Calendar -->
  <div class="cal px">
    <div class="cal-head">
      <button class="nav" id="calPrev">‹</button>
      <div class="title" id="calTitle">—</div>
      <button class="nav" id="calNext">›</button>
      <button class="nav today-btn" id="calToday">วันนี้</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <div class="list" id="list"></div>

  <footer>COLLEGE ASSIGNMENT LOG — DATA FROM <code>college.json</code> — UPDATE VIA DISCORD</footer>
</div>

<div class="overlay hidden" id="overlay">
  <div class="modal px">
    <div class="mhead">
      <h2 id="modalTitle">—</h2>
      <button class="close" id="modalClose">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<div class="overlay hidden" id="logOverlay">
  <div class="modal px">
    <div class="mhead">
      <h2>📜 ADD LOG // ประวัติการเพิ่มงาน</h2>
      <button class="close" id="logClose">✕</button>
    </div>
    <div id="logBody"></div>
  </div>
</div>

<script>
const TH_MONTHS = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
const TH_DAYS = ["อา", "จ", "อ", "พ", "พฤ", "ศ", "ส"];
const TH_DAYS_FULL = ["อาทิตย์", "จันทร์", "อังคาร", "พุธ", "พฤหัสบดี", "ศุกร์", "เสาร์"];

let DATA = null;
let calYear, calMonth;

async function load() {
  const res = await fetch("college.json", { cache: "no-store" });
  DATA = await res.json();
  const now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();
  render();
}

function todayStr() {
  const t = new Date();
  return t.getFullYear() + "-" + String(t.getMonth()+1).padStart(2,"0") + "-" + String(t.getDate()).padStart(2,"0");
}
function fmtDate(d) {
  if (!d) return "—";
  const [y, m, dd] = d.split("-").map(Number);
  return `${dd} ${TH_MONTHS[m-1]} ${y}`;
}
function fmtToday() {
  const t = new Date();
  return `${t.getDate()} ${TH_MONTHS[t.getMonth()]} ${t.getFullYear()}`;
}
function addDays(iso, n) {
  const [y, m, d] = iso.split("-").map(Number);
  const t = new Date(y, m-1, d + n);
  return t.getFullYear() + "-" + String(t.getMonth()+1).padStart(2,"0") + "-" + String(t.getDate()).padStart(2,"0");
}

function assignmentsByDate() {
  const map = {};
  for (const a of (DATA.assignments || [])) {
    if (!a.due) continue;
    (map[a.due] = map[a.due] || []).push(a);
  }
  return map;
}

function render() {
  document.getElementById("faculty").textContent = DATA.faculty || "—";
  document.getElementById("today").textContent = fmtToday();

  const asg = DATA.assignments || [];
  const today = todayStr();
  const done = asg.filter(a => a.status === "ส่งแล้ว").length;

  document.getElementById("stTotal").textContent = asg.length;
  document.getElementById("stPending").textContent = asg.length - done;
  document.getElementById("stDone").textContent = done;

  renderCalendar();
  renderMatrix();
  renderList();
}

function renderCalendar() {
  document.getElementById("calTitle").textContent = `${TH_MONTHS[calMonth]} ${calYear}`;

  const byDate = assignmentsByDate();
  const today = todayStr();

  // day-of-week header
  let html = TH_DAYS.map(d => `<div class="cal-dow">${d}</div>`).join("");

  const first = new Date(calYear, calMonth, 1);
  const startDow = first.getDay();            // 0 = Sunday
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const daysInPrev = new Date(calYear, calMonth, 0).getDate();

  const totalCells = Math.ceil((startDow + daysInMonth) / 7) * 7;

  for (let i = 0; i < totalCells; i++) {
    const dayNum = i - startDow + 1;
    let iso = null, cls = "", label;

    if (dayNum < 1) {
      // previous month
      const d = daysInPrev + dayNum;
      const pm = new Date(calYear, calMonth - 1, d);
      iso = pm.getFullYear() + "-" + String(pm.getMonth()+1).padStart(2,"0") + "-" + String(d).padStart(2,"0");
      label = d;
      cls = "other";
    } else if (dayNum > daysInMonth) {
      const d = dayNum - daysInMonth;
      const nm = new Date(calYear, calMonth + 1, d);
      iso = nm.getFullYear() + "-" + String(nm.getMonth()+1).padStart(2,"0") + "-" + String(d).padStart(2,"0");
      label = d;
      cls = "other";
    } else {
      iso = calYear + "-" + String(calMonth+1).padStart(2,"0") + "-" + String(dayNum).padStart(2,"0");
      label = dayNum;
    }

    if (iso === today) cls += " today";

    const list = byDate[iso] || [];
    let dots = "";
    if (list.length) {
      const shown = list.slice(0, 2).map(a =>
        `<span class="dot ${a.due < today && a.status !== "ส่งแล้ว" ? "overdue" : ""}">${a.title}</span>`).join("");
      const more = list.length > 2 ? `<div class="more">+${list.length - 2}</div>` : "";
      dots = `<div class="dots">${shown}${more}</div>`;
    }

    html += `<button class="cal-cell ${cls}" data-date="${iso}">
      <span class="day">${label}</span>${dots}
    </button>`;
  }

  document.getElementById("calGrid").innerHTML = html;

  document.querySelectorAll(".cal-cell[data-date]").forEach(cell => {
    cell.addEventListener("click", () => openDayModal(cell.dataset.date));
  });
}

function renderMatrix() {
  const asg = DATA.assignments || [];
  const today = todayStr();

  // priority: "q1"(ด่วน+สำคัญ) | "q2"(สำคัญ ไม่ด่วน) | "q3"(ด่วน ไม่สำคัญ) | "q4"(ไม่ด่วน ไม่สำคัญ)
  const quads = [
    { key: "q1", cls: "mx-q1", label: "Q1 ด่วน + สำคัญ", sub: "ทำก่อน" },
    { key: "q2", cls: "mx-q2", label: "Q2 สำคัญ ไม่ด่วน", sub: "วางแผน" },
    { key: "q3", cls: "mx-q3", label: "Q3 ด่วน ไม่สำคัญ", sub: "มอบหมาย" },
    { key: "q4", cls: "mx-q4", label: "Q4 ไม่ด่วน ไม่สำคัญ", sub: "ทีหลัง" }
  ];

  const buckets = { q1: [], q2: [], q3: [], q4: [], unassigned: [] };
  for (const a of asg) {
    const p = (a.priority || "").toLowerCase();
    if (p === "q1" || p === "q2" || p === "q3" || p === "q4") buckets[p].push(a);
    else buckets.unassigned.push(a);
  }

  const itemHtml = a => `
    <div class="mx-item">
      ${a.title}
      <span class="c">· ${a.course_code || "—"} · ${fmtDate(a.due)}</span>
    </div>`;

  document.getElementById("mxGrid").innerHTML = quads.map(q => `
    <div class="mx-quad ${q.cls}">
      <span class="qh">${q.label}</span><span class="qsub">${q.sub}</span>
      ${buckets[q.key].length
        ? buckets[q.key].map(itemHtml).join("")
        : `<div class="mx-empty">— ไม่มีงาน —</div>`}
    </div>`).join("");

  const un = document.getElementById("mxUnassigned");
  if (buckets.unassigned.length) {
    un.style.display = "block";
    un.innerHTML = `<div class="lbl">ยังไม่จัดลำดับ</div>` +
      buckets.unassigned.map(itemHtml).join("");
  } else {
    un.style.display = "none";
  }
}

function openDayModal(iso) {
  const byDate = assignmentsByDate();
  const list = byDate[iso] || [];
  const today = todayStr();
  const d = new Date(iso + "T00:00:00");

  document.getElementById("modalTitle").textContent =
    `${TH_DAYS_FULL[d.getDay()]} ${fmtDate(iso)}`;

  document.getElementById("modalBody").innerHTML = list.length
    ? list.map(a => `
      <div class="mini">
        <div class="t">${a.title} <span style="font-weight:400;color:var(--muted)">[${a.course_code || "—"}]</span></div>
        <div class="s">อ. ${a.instructor || "—"} · ${a.submission || "—"} · ${a.status || "—"}${a.score != null ? ` · ${a.score} pt` : ""}</div>
        ${a.task ? `<div class="s" style="margin-top:4px">${a.task}</div>` : ""}
      </div>`).join("")
    : `<div class="empty" style="padding:24px"><div class="big">NO WORK</div><div>ไม่มีงานต้องส่งวันนี้</div></div>`;

  document.getElementById("overlay").classList.remove("hidden");
}

function renderList() {
  const asg = (DATA.assignments || []).slice().sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999"));
  const today = todayStr();

  if (!asg.length) {
    document.getElementById("list").innerHTML = `
      <div class="section-title">// งานทั้งหมด</div>
      <div class="px empty">
        <div class="big">NO ASSIGNMENT YET</div>
        <div>ยังไม่มีงาน — สั่งเพิ่มผ่าน Discord ได้เลย</div>
      </div>`;
    return;
  }

  document.getElementById("list").innerHTML = `
    <div class="section-title">// งานทั้งหมด</div>
    ${asg.map(a => {
      const overdue = a.due && a.due < today && a.status !== "ส่งแล้ว";
      const soon = a.due && a.due >= today && a.due <= addDays(today, 3) && a.status !== "ส่งแล้ว";
      const cls = overdue ? "overdue" : (soon ? "due-soon" : "");
      return `
      <div class="card px ${cls}">
        <span class="code">${a.course_code || "—"}</span>
        ${overdue ? `<span class="badge">OVERDUE</span>` : ""}
        <h2>${a.title || "—"}</h2>
        <div class="inst">อ. <b>${a.instructor || "—"}</b></div>
        ${a.task ? `<div class="task">${a.task}</div>` : ""}
        <div class="meta">
          <div class="m"><div class="lbl">ช่องทางการส่ง</div><div class="val">${a.submission || "—"}</div></div>
          <div class="m"><div class="lbl">กำหนดส่ง</div><div class="val">${fmtDate(a.due)}</div></div>
          <div class="m"><div class="lbl">สถานะ</div><div class="val">${a.status || "—"}</div></div>
        </div>
        ${a.score != null ? `<div class="score">${a.score}pt</div>` : ""}
      </div>`;
    }).join("")}`;
}

// Calendar nav
document.getElementById("calPrev").onclick = () => { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCalendar(); };
document.getElementById("calNext").onclick = () => { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCalendar(); };
document.getElementById("calToday").onclick = () => {
  const now = new Date(); calYear = now.getFullYear(); calMonth = now.getMonth(); renderCalendar();
};
document.getElementById("modalClose").onclick = () => document.getElementById("overlay").classList.add("hidden");
document.getElementById("overlay").onclick = e => {
  if (e.target === e.currentTarget) e.currentTarget.classList.add("hidden");
};

// Faculty card button -> add log
document.getElementById("facultyCard").onclick = () => openLogModal();
document.getElementById("logClose").onclick = () => document.getElementById("logOverlay").classList.add("hidden");
document.getElementById("logOverlay").onclick = e => {
  if (e.target === e.currentTarget) e.currentTarget.classList.add("hidden");
};

function openLogModal() {
  const log = DATA.log || [];
  document.getElementById("logBody").innerHTML = log.length
    ? log.map((l, i) => `
      <div class="mini">
        <div class="t">• ${fmtDate(l.date)} — ${l.course_code || "—"} <span style="color:var(--muted);font-weight:400">${l.title || "—"}${l.due ? ` · ส่ง ${fmtDate(l.due)}` : ""}</span></div>
      </div>`).join("")
    : `<div class="empty" style="padding:24px"><div class="big">NO LOG</div><div>ยังไม่มีประวัติการเพิ่มงาน</div></div>`;
  document.getElementById("logOverlay").classList.remove("hidden");
}

load();
</script>
</body>
</html>
